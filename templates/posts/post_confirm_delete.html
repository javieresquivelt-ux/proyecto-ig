{% extends "general/layout.html" %}

{% load i18n %}

{% block title %}{% trans "Delete post" %}{% endblock %}

{% block page_content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    <h4 class="mb-3">{% trans "Delete post" %}</h4>
                    <p class="mb-4">{% trans "Are you sure you want to delete this post?" %}</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger me-2">{% trans "Delete" %}</button>
                        <a href="{% url 'post_detail' post.pk %}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
