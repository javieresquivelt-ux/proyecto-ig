{% extends "general/layout.html" %}

{% load crispy_forms_tags i18n %}

{% block title %}{% trans "Register Page" %}{% endblock %}

{% block page_content %}
<div class="container">
    <h1>{% trans "Register" %}</h1>
    <form action="" method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">{% trans "Register" %}</button>
    </form>
</div>
{% endblock %}
